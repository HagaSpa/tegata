<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tegata Login Page</title>
</head>
<body>
    <h2> Tegata OIDC Server </h2>
    <div align="center">
        {{if .Error}} Error occured. {{.Error}} {{end}}
        <form action="/authorize" method="post">
            <input type="hidden" name="id" value="{{.ID}}">
            <table border="0">
                <tr>
                    <th>
                        username
                    </th>
                    <td>
                        <input type="text" name="username" value="" size="24">
                    </td>
                </tr>
                <tr>
                    <th>
                        password
                    </th>
                    <td>
                        <input type="password" name="password" value="" size="24">
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                      <button type="submit" name="action" value="approve"> approve </button>
                      <button type="submit" name="action" value="deny"> deny </button>
                    </td>
                </tr>
            </table>
        </form>
        <a href="/register?id={{.ID}}"> Sign Up Page </a>
    </div>
</body>
</html>

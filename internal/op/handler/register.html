<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tegata SignUp Page</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="op">
    <header>
        <div class="inner">
            <span class="brand">Tegata OIDC Server</span>
            <span class="role">OpenID Provider</span>
        </div>
    </header>
    <main>
        <div class="card">
            <h1>Sign up</h1>
            {{if .Error}}
            <p class="error">
                Error occured. {{.Error}}
            </p>
            {{end}}
            <form action="/register" method="post">
                <input type="hidden" name="id" value="{{.ID}}">
                <label for="username">username</label>
                <input type="text" id="username" name="username" value="" autocomplete="username">
                <label for="password">password</label>
                <input type="password" id="password" name="password" value="" autocomplete="new-password">
                <label for="name">name</label>
                <input type="text" id="name" name="name" value="" autocomplete="name">
                <label for="email">email</label>
                <input type="email" id="email" name="email" value="" autocomplete="email">
                <p class="muted">The password must be 15 to 64 characters long. After signing up, you go back to the login page of the same request.</p>
                <div class="actions">
                    <button type="submit">register</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>

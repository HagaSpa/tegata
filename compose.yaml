services:
  openid-provider:
    environment:
      - TZ=Asia/Tokyo
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: op
    ports:
      - "8080:8080"
      - "5556:5556"
  relying-party:
    build:
      context: .
      dockerfile: Dockerfile.rp
    network_mode: "service:openid-provider"
    restart: on-failure
    depends_on:
      - openid-provider
    environment:
      - ISSUER=http://localhost:8080
      - LISTEN=0.0.0.0:5556
      - REDIRECT_URL=http://127.0.0.1:5556/callback

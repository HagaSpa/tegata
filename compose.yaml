services:
  openid-provider:
    environment:
      - TZ=Asia/Tokyo
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: op
    ports:
      - "8080:8080"
      - "5556:5556"
      - "9000:9000"
  resource-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: rs
    network_mode: "service:openid-provider"
    restart: on-failure
    depends_on:
      - openid-provider
    environment:
      - TZ=Asia/Tokyo
      - ISSUER=http://localhost:8080
  relying-party:
    build:
      context: .
      dockerfile: Dockerfile.rp
    network_mode: "service:openid-provider"
    restart: on-failure
    depends_on:
      - openid-provider
    environment:
      - ISSUER=http://localhost:8080
      - LISTEN=0.0.0.0:5556
      - REDIRECT_URL=http://127.0.0.1:5556/callback
      - POST_LOGOUT_REDIRECT_URL=http://127.0.0.1:5556/
      - NOTES_URL=http://localhost:9000/notes

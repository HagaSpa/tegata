[tools]
go = "1.27.1"

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.race]
description = "Run all tests with the race detector"
run = "go test -race ./..."

[tasks.start]
description = "Build and start tegata and the RP (open http://127.0.0.1:5556/)"
run = "docker compose up --build"

[tasks.stop]
description = "Stop and remove the compose containers"
run = "docker compose down"

[tasks.serve]
description = "Run tegata locally with go run (http://localhost:8080)"
run = "go run ./cmd/op"

[tasks.smoke]
description = "Check /authorize and token behavior against a running OpenID Provider (start it with mise serve)"
run = ["./scripts/smoke-authorize.sh", "./scripts/smoke-token.sh"]

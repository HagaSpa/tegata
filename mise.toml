[tools]
go = "1.27.1"

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.race]
description = "Run all tests with the race detector"
run = "go test -race ./..."

[tasks.start]
description = "Build and start tegata, the RS and the RP (open http://127.0.0.1:5556/)"
run = "docker compose up --build"

[tasks.stop]
description = "Stop and remove the compose containers"
run = "docker compose down"

[tasks.serve]
description = "Run tegata locally with go run (http://localhost:8080)"
run = "go run ./cmd/op"

[tasks.serve-rs]
description = "Run the resource server locally with go run (http://localhost:9000, needs mise serve)"
run = "go run ./cmd/rs"

[tasks.demo-op-restart]
description = "Restart only the OP and watch the RS refetch JWKS for an unknown kid (stop mise serve / serve-rs / start first)"
run = "./scripts/demo-op-restart.sh"

[tasks.conformance]
description = "Start the OpenID conformance suite in the background (https://localhost.emobix.co.uk:8443)"
run = "docker compose -f compose.conformance.yaml up -d"

[tasks.conformance-stop]
description = "Stop the conformance suite (results stay in the mongodb volume)"
run = "docker compose -f compose.conformance.yaml down"

[tasks.serve-conformance]
description = "Run tegata locally with the issuer the conformance suite can reach (http://tegata.localhost:8080)"
env = { ISSUER = "http://tegata.localhost:8080" }
run = "go run ./cmd/op"

[tasks.conformance-plans]
description = "Create Basic OP and Config OP test plans in the conformance suite and print their URLs (needs mise conformance and mise serve-conformance)"
run = "./scripts/conformance-plans.sh"

[tasks.smoke]
description = "Check /authorize, /register, token, refresh/revoke and resource server behavior (start them with mise serve and mise serve-rs, or mise start)"
run = ["./scripts/smoke-authorize.sh", "./scripts/smoke-register.sh", "./scripts/smoke-token.sh", "./scripts/smoke-refresh.sh", "./scripts/smoke-rs.sh"]

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tegata Sample RP</title>
</head>
<body>
    <h2> Tegata Sample RP </h2>
    <div align="center">
        {{if .Message}}
        <p> {{.Message}} </p>
        {{end}}
        {{if .SignedIn}}
        <p> You are signed in at this RP. <a href="/home"> Home </a> </p>
        {{end}}
        <table border="1">
            <tr>
                <td>
                    <form action="/login" method="get">
                        <button type="submit"> Sign in with tegata </button>
                    </form>
                </td>
                <td> Goes to the login page of tegata </td>
            </tr>
            <tr>
                <td>
                    <form action="/login" method="get">
                        <input type="hidden" name="prompt" value="none">
                        <button type="submit"> Sign in with prompt=none </button>
                    </form>
                </td>
                <td> Signs in without the login page while the session at tegata is alive. Otherwise tegata returns login_required </td>
            </tr>
        </table>
    </div>
</body>
</html>
